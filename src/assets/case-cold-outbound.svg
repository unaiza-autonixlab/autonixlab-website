<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-label="Cold outbound pipeline: source, research, personalise, sequence, reply">
  <defs>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <linearGradient id="flow3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B33" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF6B33" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="460" fill="#0A0A0A"/>
  <rect width="800" height="460" fill="url(#grid3)"/>

  <text x="40" y="38" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#FF6B33" letter-spacing="2">COLD OUTBOUND ENGINE</text>

  <!-- Stages -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <g>
      <rect x="40" y="120" width="132" height="88" rx="4" fill="#111111" stroke="rgba(255,255,255,0.12)"/>
      <text x="106" y="152" text-anchor="middle" font-size="12" fill="#FFFFFF">source</text>
      <text x="106" y="174" text-anchor="middle" font-size="10" fill="#8A8A8A">build the list</text>
      <text x="106" y="190" text-anchor="middle" font-size="10" fill="#8A8A8A">verify the address</text>
    </g>
    <g>
      <rect x="207" y="120" width="132" height="88" rx="4" fill="#111111" stroke="rgba(255,255,255,0.12)"/>
      <text x="273" y="152" text-anchor="middle" font-size="12" fill="#FFFFFF">research</text>
      <text x="273" y="174" text-anchor="middle" font-size="10" fill="#8A8A8A">read the account</text>
      <text x="273" y="190" text-anchor="middle" font-size="10" fill="#8A8A8A">find the detail</text>
    </g>
    <g>
      <rect x="374" y="120" width="132" height="88" rx="4" fill="#111111" stroke="rgba(255,255,255,0.12)"/>
      <text x="440" y="152" text-anchor="middle" font-size="12" fill="#FFFFFF">personalise</text>
      <text x="440" y="174" text-anchor="middle" font-size="10" fill="#8A8A8A">one line nobody</text>
      <text x="440" y="190" text-anchor="middle" font-size="10" fill="#8A8A8A">else could write</text>
    </g>
    <g>
      <rect x="541" y="120" width="132" height="88" rx="4" fill="#111111" stroke="#FF6B33" stroke-opacity="0.5"/>
      <text x="607" y="152" text-anchor="middle" font-size="12" fill="#FFFFFF">sequence</text>
      <text x="607" y="174" text-anchor="middle" font-size="10" fill="#8A8A8A">send, wait, follow</text>
      <text x="607" y="190" text-anchor="middle" font-size="10" fill="#8A8A8A">stop on reply</text>
    </g>
  </g>

  <g fill="none" stroke="url(#flow3)" stroke-width="2">
    <path d="M172 164 L 207 164"/>
    <path d="M339 164 L 374 164"/>
    <path d="M506 164 L 541 164"/>
  </g>
  <g fill="#FF6B33" fill-opacity="0.8">
    <path d="M200 160 l 7 4 -7 4 z"/>
    <path d="M367 160 l 7 4 -7 4 z"/>
    <path d="M534 160 l 7 4 -7 4 z"/>
  </g>

  <!-- Result -->
  <rect x="40" y="252" width="633" height="86" rx="4" fill="#111111" stroke="rgba(255,255,255,0.10)"/>
  <text x="66" y="284" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#8A8A8A">reply rate</text>
  <text x="66" y="320" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="28" fill="#FF6B33">3.68%</text>

  <g>
    <rect x="220" y="272" width="428" height="10" rx="5" fill="rgba(255,255,255,0.06)"/>
    <rect x="220" y="272" width="58" height="10" rx="5" fill="#FF6B33" fill-opacity="0.8"/>
    <text x="220" y="308" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#8A8A8A">measured on a live campaign, not a projection</text>
    <text x="220" y="324" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#8A8A8A">closed high-ticket work</text>
  </g>

  <line x1="40" y1="378" x2="760" y2="378" stroke="rgba(255,255,255,0.10)"/>
  <text x="40" y="408" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#FF6B33">✓</text>
  <text x="62" y="408" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#FFFFFF">the same pipeline I run for my own outbound</text>
  <text x="62" y="428" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#8A8A8A">built, measured, and still running</text>
</svg>
